<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="足し算">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>足し算アプリ</title>
<style>
/* layout: 1 column card, big touch-friendly inputs, result at the bottom */
:root {
  --bg: #f1f4f2;
  --card: #ffffff;
  --ink: #1b2421;
  --muted: #5d6b66;
  --line: #d3dcd8;
  --accent: #1f6f5c;
  --accent-ink: #ffffff;
  --result-bg: #e3f1ec;
  --font: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #131a18; --card: #1c2522; --ink: #e8efec; --muted: #9bada6;
    --line: #33423d; --accent: #5cc3a6; --accent-ink: #0d1713; --result-bg: #1f3a32;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #131a18; --card: #1c2522; --ink: #e8efec; --muted: #9bada6;
  --line: #33423d; --accent: #5cc3a6; --accent-ink: #0d1713; --result-bg: #1f3a32;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font);
  display: flex; justify-content: center; padding: 24px 16px;
}
main { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: 1.25rem; margin: 0; text-wrap: balance; }
p.note { margin: 0; color: var(--muted); font-size: 0.875rem; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 20px; display: flex; flex-direction: column; gap: 16px;
}
label { display: flex; flex-direction: column; gap: 6px; font-size: 0.875rem; color: var(--muted); }
input {
  font: inherit; font-size: 1.5rem; padding: 12px 14px; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  width: 100%; font-variant-numeric: tabular-nums;
}
input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.result {
  background: var(--result-bg); border-radius: 10px; padding: 16px;
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
}
.result span { color: var(--muted); font-size: 0.875rem; }
.result output { font-size: 2.5rem; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
button {
  font: inherit; font-size: 1rem; padding: 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; color: var(--ink);
}
</style>
</head>
<body>
<main>
  <h1>足し算アプリ</h1>
  <p class="note">2つの数を入れると、合計がすぐ出ます。</p>
  <form class="card" id="f" autocomplete="off">
    <label for="a">1つ目の数
      <input id="a" type="number" inputmode="decimal" step="any" value="5">
    </label>
    <label for="b">2つ目の数
      <input id="b" type="number" inputmode="decimal" step="any" value="5">
    </label>
    <div class="result" aria-live="polite">
      <span>合計</span>
      <output id="out" for="a b">10</output>
    </div>
    <button type="button" id="clear">クリア</button>
  </form>
</main>
<script>
(function () {
  var a = document.getElementById('a');
  var b = document.getElementById('b');
  var out = document.getElementById('out');
  function calc() {
    if (a.value === '' || b.value === '') { out.textContent = '–'; return; }
    var s = parseFloat(a.value) + parseFloat(b.value);
    // 0.1+0.2 のような小数の誤差を丸める
    out.textContent = String(Math.round(s * 1e9) / 1e9);
  }
  a.addEventListener('input', calc);
  b.addEventListener('input', calc);
  document.getElementById('f').addEventListener('submit', function (e) { e.preventDefault(); });
  document.getElementById('clear').addEventListener('click', function () {
    a.value = ''; b.value = ''; calc(); a.focus();
  });
  calc();
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
